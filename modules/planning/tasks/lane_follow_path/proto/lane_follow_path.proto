syntax = "proto2";

import "modules/planning/planning_base/proto/piecewise_jerk_path_config.proto";

package apollo.planning;

message LaneFollowPathConfig {
  //whether to extend path bound including adc bound
  optional bool is_extend_lane_bounds_to_include_adc = 1;
  //whether to extend adc bound buffer
  optional double extend_buffer = 2;
  optional PiecewiseJerkPathConfig path_optimizer_config = 3;
  // Widen the lane boundary by this buffer (meters) on each side, so the ego
  // has extra lateral room to dodge a lane-blocking obstacle (the narrow
  // contest lane is blocked by a car head, so the ego needs lane width >= ego
  // width + the obstacle's protrusion). 0 = no widening.
  optional double lane_width_buffer = 4 [default = 0.0];
  // Force the ego to dodge obstacles on their LEFT side (pass on the left).
  // The default heuristic may choose right; contest 6 requires dodging left.
  optional bool force_left_nudge = 5 [default = false];
}