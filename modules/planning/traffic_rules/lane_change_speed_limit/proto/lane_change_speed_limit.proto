syntax = "proto2";

package apollo.planning;

message LaneChangeSpeedLimitConfig {
  // Cruise speed cap (m/s) applied while change_lane status is
  // IN_CHANGE_LANE or CHANGE_LANE_FINISHED. 8.3333 m/s == 30 km/h.
  optional double speed_limit = 1 [default = 8.3333];
  // Cruise speed cap (m/s) applied while driving straight (no lane change
  // has been observed yet). 10.0 m/s == 36 km/h.
  optional double straight_speed_limit = 2 [default = 10.0];
}
